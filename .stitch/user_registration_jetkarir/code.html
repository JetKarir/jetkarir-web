<!-- Top Navigation / Logo Anchor -->

<!-- Main Registration Canvas -->
<main class="flex-grow flex items-center justify-center w-full px-margin-mobile py-xl">
<div class="w-full max-w-[440px] glass-card rounded-xl p-8 md:p-10 transition-all duration-300 relative overflow-hidden bg-white"><div class="h-2 w-full bg-primary absolute top-0 left-0 rounded-t-xl"></div>
<!-- Header Section -->
<div class="text-center mb-8"><div class="flex items-center justify-center gap-2 mb-4"><span class="text-primary font-headline-md text-headline-md font-extrabold tracking-tight">&nbsp;JetKarir</span></div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start your career journey today.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6" id="registerForm">
<!-- Full Name -->
<div class="space-y-1.5">
<label for="fullName" class="font-label-md text-label-md text-on-surface-variant block">FULL NAME</label>
<div class="relative">
<input type="text" id="fullName" name="fullName" placeholder="John Doe" required="" class="w-full px-4 py-3 border border-outline-variant rounded-lg font-body-md text-body-md auth-input transition-all">
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label for="email" class="font-label-md text-label-md text-on-surface-variant block">EMAIL ADDRESS</label>
<div class="relative">
<input type="email" id="email" name="email" placeholder="name@company.com" required="" class="w-full px-4 py-3 border border-outline-variant rounded-lg font-body-md text-body-md auth-input transition-all">
</div>
</div>
<!-- Password -->
<div class="space-y-1.5">
<label for="password" class="font-label-md text-label-md text-on-surface-variant block">PASSWORD</label>
<div class="relative">
<input type="password" id="password" name="password" placeholder="••••••••" required="" class="w-full px-4 py-3 border border-outline-variant rounded-lg font-body-md text-body-md auth-input transition-all pr-12">
<button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span id="eyeIcon" class="material-symbols-outlined">visibility</span>
</button>
</div>
</div><div class="space-y-1.5">
<label for="confirmPassword" class="font-label-md text-label-md text-on-surface-variant block">CONFIRM PASSWORD</label>
<div class="relative">
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" class="w-full px-4 py-3 border border-outline-variant rounded-lg font-body-md text-body-md auth-input transition-all pr-12">
<button type="button" onclick="toggleConfirmPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span id="confirmEyeIcon" class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Terms & Privacy -->
<div class="flex items-start gap-3 py-2">
<input type="checkbox" id="terms" name="terms" required="" class="mt-1 w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary">
<label for="terms" class="font-body-sm text-body-sm text-on-surface-variant">
                        I accept the <a href="#" class="text-primary font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-primary font-semibold hover:underline">Privacy Policy</a>
</label>
</div>
<!-- Action Buttons -->
<div class="space-y-4 pt-2">
<button type="submit" class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/10">
                        Create Account
                    </button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-outline">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button type="button" class="w-full flex items-center justify-center gap-3 bg-white border border-outline-variant text-on-surface font-label-md text-label-md py-4 rounded-lg hover:bg-surface-container-low active:scale-[0.98] transition-all"><svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>Google</button>
</div>

<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account?

</p>
</div><div class="pt-4 mt-4 border-t border-outline-variant">
<a class="inline-flex items-center justify-center w-full font-label-md text-label-md text-primary hover:text-primary-container transition-colors uppercase group" href="/">
<span class="material-symbols-outlined text-[18px] mr-1 group-hover:-translate-x-1 transition-transform">arrow_back</span>
EXPLORE JETKARIR HOME PAGE
</a>
</div>
</div>

<footer class="w-full py-8 px-gutter border-t border-outline-variant flex flex-col items-center gap-4 justify-center"><nav class="flex gap-6 justify-center w-full">

</nav>
<div class="text-on-surface-variant font-body-sm text-body-sm text-center w-full">
            © 2024 JetKarir. All rights reserved.
        </div></footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple animation on form submit
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Creating Account...</span>';
            btn.disabled = true;
            
            // Artificial delay for effect
            setTimeout(() => {
                alert('Account created successfully!');
                btn.innerHTML = 'Account Created';
            }, 1500);
        });
    </script>
