<div class="flex-grow flex items-center justify-center w-full"></div><div class="kinetic-card w-full max-w-[480px] bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant relative mx-auto"><div class="h-1.5 w-full bg-primary"></div><div class="p-md md:p-lg flex flex-col gap-md"><header class="flex flex-col gap-xs mb-sm text-center"><span class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">JetKarir</span><h1 class="font-headline-lg text-headline-lg text-primary">Verify Your Email</h1><p class="font-body-md text-body-md text-on-surface-variant">We've sent a 6-digit code to your email. Please enter it below to verify your account.</p></header><form class="flex flex-col gap-md" id="otp-form"><div class="flex justify-center gap-2 sm:gap-4 mb-6"><input aria-label="Digit 1" class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:border-primary focus:outline-none input-halo transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"><input aria-label="Digit 2" class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:border-primary focus:outline-none input-halo transition-all" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"><input aria-label="Digit 3" class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:border-primary focus:outline-none input-halo transition-all" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"><input aria-label="Digit 4" class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:border-primary focus:outline-none input-halo transition-all" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"><input aria-label="Digit 5" class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:border-primary focus:outline-none input-halo transition-all" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"><input aria-label="Digit 6" class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface border border-outline-variant rounded-lg focus:border-primary focus:outline-none input-halo transition-all" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"></div><button class="w-full bg-primary text-on-primary py-4 rounded-lg font-headline-sm text-headline-sm hover:bg-primary-container transition-all active:scale-[0.98] duration-150 shadow-sm uppercase" type="submit">Verify Code</button><div class="text-center mt-2"><p class="font-body-sm text-body-sm text-on-surface-variant">Didn't receive the code? <a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors ml-1 uppercase" href="#">Resend Code</a></p></div></form><footer class="mt-md flex flex-col gap-sm border-t border-outline-variant pt-md"><a class="flex items-center gap-2 text-primary font-body-md text-body-md hover:translate-x-[-4px] transition-transform duration-200" href="#"><span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>Back to Sign In</a></footer></div></div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otp-form');

            // Handle input behavior
            inputs.forEach((input, index) => {
                // Focus next input on type
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    
                    // Allow only numbers
                    if (!/^\d*$/.test(value)) {
                        input.value = '';
                        return;
                    }

                    if (value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].disabled = false;
                        inputs[index + 1].focus();
                    }
                });

                // Handle backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = ''; // Optional: clear previous on backspace
                        // Disable current if it was empty and we moved back
                         input.disabled = true;
                    }
                });

                // Handle paste (basic implementation)
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text').slice(0, 6);
                    if (/^\d+$/.test(pasteData)) {
                        const digits = pasteData.split('');
                        digits.forEach((digit, i) => {
                            if (inputs[i]) {
                                inputs[i].disabled = false;
                                inputs[i].value = digit;
                                if (i < inputs.length - 1) inputs[i+1].focus();
                                else inputs[i].focus();
                            }
                        });
                    }
                });
            });
            
            // Initial focus
            inputs[0].focus();

            // Form submission visual feedback
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                // Collect OTP
                let otp = '';
                inputs.forEach(input => otp += input.value);
                
                if(otp.length === 6) {
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Verifying...';
                    btn.classList.add('opacity-80', 'cursor-not-allowed');
                    btn.disabled = true;

                    // Simulate API call
                    setTimeout(() => {
                        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Verified';
                        btn.classList.remove('bg-primary');
                        btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                        
                        setTimeout(() => {
                            // Reset for demo purposes
                            btn.innerHTML = originalText;
                            btn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-secondary-container', 'text-on-secondary-container');
                            btn.classList.add('bg-primary');
                            btn.disabled = false;
                            inputs.forEach((input, i) => {
                                input.value = '';
                                if(i > 0) input.disabled = true;
                            });
                            inputs[0].focus();
                        }, 2000);
                    }, 1500);
                } else {
                    // Shake animation for invalid
                    form.classList.add('animate-[shake_0.5s_ease-in-out]');
                    setTimeout(() => form.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
                }
            });
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
