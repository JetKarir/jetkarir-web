<body class="bg-surface-bright min-h-screen flex flex-col font-body-md text-on-surface selection:bg-primary-fixed-dim selection:text-primary">
<main class="flex-grow flex items-center justify-center px-margin-mobile py-lg">
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border-t-4 border-primary overflow-hidden transition-all duration-300">
<div class="px-md py-lg space-y-md">
<!-- Logo & Header -->
<div class="text-center space-y-xs">
<h1 class="font-headline-md text-headline-md text-primary font-extrabold tracking-tight">JetKarir</h1>
<div class="pt-sm space-y-base">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Log in to continue your career journey.</p>
</div>
</div>
<!-- Input Group -->
<form class="space-y-md pt-sm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest px-1" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all text-body-md" id="email" placeholder="name@company.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all text-body-md" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-bold py-3.5 rounded-lg active:scale-[0.98] transition-transform duration-150 shadow-md hover:bg-primary/95" type="submit">
                        SIGN IN

</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-sm">
<div class="h-px flex-grow bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-px flex-grow bg-outline-variant"></div>
</div>
<!-- Social Sign In -->
<button class="w-full flex items-center justify-center gap-3 border border-outline-variant bg-surface-container-lowest py-3 rounded-lg hover:bg-surface-container-low active:bg-surface-container-high transition-colors text-on-surface font-semibold shadow-sm">

</div>Google

<script>
        // Micro-interactions
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.group').querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            });
            input.addEventListener('blur', () => {
                input.closest('.group').querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
            });
        });

        // Subtle parallax effect on background based on device tilt (optional flare)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const x = e.beta / 45; // limit tilt impact
                const y = e.gamma / 45;
                document.body.style.backgroundPosition = `${50 + y}% ${50 + x}%`;
            });
        }
    </script>
