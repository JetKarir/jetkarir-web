<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JetKarir — AI-Powered Global Recruitment Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Find your dream job with JetKarir's AI-powered platform. AI Resume Builder, Auto Apply, and personalized feedback. 50K+ jobs, 200K+ users worldwide." />
    <meta property="og:site_name" content="JetKarir" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://jetkarir.com/images/foto_landing_hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="icons/logo_icon_jetkarir_bg_white.ico" />
    <script type="application/ld+json" id="org-ld">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JetKarir",
      "url": "https://jetkarir.com",
      "logo": "https://jetkarir.com/images/logo_text_jetkarir.png",
      "description": "AI-powered global recruitment platform"
    }
    </script>
    <script type="application/ld+json" id="website-ld">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JetKarir",
      "url": "https://jetkarir.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jetkarir.com/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
