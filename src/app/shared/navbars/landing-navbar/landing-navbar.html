<header class="lp-nav" role="banner">
  <div class="lp-container lp-nav__inner">
    <a routerLink="/" class="lp-nav__logo">
      <img src="images/logo_text_jetkarir.png" alt="JetKarir" height="22" />
    </a>
    <nav class="lp-nav__links" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="lp-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="lp-nav__link"
        >Home</a
      >
      <a routerLink="/main/jobs" class="lp-nav__link">Jobs</a>
      <a routerLink="/main/people" class="lp-nav__link">People</a>
      <a routerLink="/main/companies" class="lp-nav__link">Companies</a>
      <a routerLink="/about" class="lp-nav__link">About</a>
    </nav>
    <div class="lp-nav__actions">
      <a routerLink="/auth/login" class="lp-nav__btn lp-nav__btn--ghost">Login</a>
      <a routerLink="/auth/register" class="lp-nav__btn lp-nav__btn--primary">Register</a>
    </div>
  </div>
</header>
