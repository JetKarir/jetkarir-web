<div class="main-layout">
  <!-- Desktop Sidebar -->
  <app-main-navbar />

  <!-- Mobile Top Bar -->
  <header class="top-bar">
    <a routerLink="/home" class="top-bar__logo">
      <img src="images/logo_text_jetkarir.png" alt="JetKarir" height="20" />
    </a>
    <div class="top-bar__actions">
      <a routerLink="/notifications" class="top-bar__icon-btn" title="Notifications">
        <ng-icon name="fluentAlert" />
      </a>
      @if (user()) {
        <p-avatar [label]="userInitials()" shape="circle" class="top-bar__avatar" />
      }
    </div>
  </header>

  <!-- Page content -->
  <main class="main-layout__content">
    <router-outlet />
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    @for (item of bottomNavItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" class="bottom-nav__item">
        <ng-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <p-toast />
</div>
