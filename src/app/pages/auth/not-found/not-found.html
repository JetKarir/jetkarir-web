<div class="auth-not-found">
  <!-- Header -->
  <div class="auth-not-found__header">
    <a routerLink="/" class="auth-not-found__brand">
      <img src="images/logo_text_jetkarir.png" alt="JetKarir" class="auth-not-found__brand-img" />
    </a>
  </div>

  <!-- Illustration -->
  <img
    class="auth-not-found__img"
    src="images/foto_page_not_found.jpg"
    alt="Page not found illustration"
  />

  <!-- Content -->
  <div class="auth-not-found__content">
    <h1 class="auth-not-found__title">404 - Page Not Found</h1>
    <p class="auth-not-found__message">
      The page you are looking for doesn't exist or has been moved.
    </p>
  </div>

  <!-- Actions -->
  <div class="auth-not-found__actions">
    <a routerLink="/login" class="auth-not-found__btn auth-not-found__btn--primary">
      Go to Login
    </a>
    <a routerLink="/" class="auth-not-found__btn auth-not-found__btn--ghost">
      Back to Home
    </a>
  </div>
</div>
