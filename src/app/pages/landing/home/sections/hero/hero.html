<section class="lp-hero">
  <div class="lp-container lp-hero__inner">
    <div class="lp-hero__content">
      <h1 class="lp-hero__title">
        Boost Your Career Growth with AI-Powered Global Recruitment Platform
      </h1>
      <p class="lp-hero__subtitle">
        The most advanced end-to-end platform for candidates seeking global roles and enterprises
        optimizing their recruitment process with AI-driven velocity.
      </p>
      <div class="lp-hero__cta">
        <a routerLink="/auth/register" class="lp-hero__btn">
          Get Started
          <ng-icon name="fluentArrowRight" size="20px" />
        </a>
      </div>
    </div>
    <div class="lp-hero__visual">
      <div class="lp-glass-card">
        <img
          class="lp-glass-card__img"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdC5EGEOQTa_NzZtY20oAHY4WcqhwiFdgEQ0ahT5nrcP436_tlCsqfDPuVOXYFOIJZrMpTvqY7oNFtZfiLbKZrafRhPHvpJnY1BFH0YXTAdUCIYZ6EIhPygHe1Nwt1lLQnckE_f5XZN4AWbw0_vTs8eJlXs9aw2erwAPb_emJrnxklbjTEdAcuAP9WTEN2Twk8juHebY-c3m16yaE1lJGLqjkYhzm9p0DeA_mPpHQsOgiMjpCy9eRPCQ"
          alt="Professional shaking hands with AI assistant in a modern office"
          loading="eager"
        />
      </div>
      <div class="lp-hero__chip">
        <div class="lp-hero__chip-icon">
          <ng-icon name="fluentSparkle" size="24px" />
        </div>
        <div>
          <p class="lp-hero__chip-label">Job Match Rate</p>
          <p class="lp-hero__chip-value">98.4% Accuracy</p>
        </div>
      </div>
    </div>
  </div>
</section>
