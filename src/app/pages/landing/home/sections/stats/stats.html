<section class="lp-stats">
  <div class="lp-container">
    <div class="lp-stats__heading">
      <h2 class="lp-stats__title">Our Global Impact</h2>
      <p class="lp-stats__desc">Driving recruitment velocity at a global scale.</p>
    </div>
    <div class="lp-stats__grid">
      @for (s of stats; track s.label) {
        <div class="lp-stats__item">
          <span class="lp-stats__value">{{ s.value }}</span>
          <span class="lp-stats__label">{{ s.label }}</span>
        </div>
      }
    </div>
  </div>
</section>
