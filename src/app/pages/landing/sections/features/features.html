<section class="lp-features" id="features">
  <div class="lp-container">
    <div class="lp-section-header">
      <span class="lp-section-tag">Core Features</span>
      <h2 class="lp-section-title">Everything you need<br />in one platform</h2>
      <p class="lp-section-sub">
        From job discovery to getting hired, JetKarir supports every step of your career journey.
      </p>
    </div>
    <div class="lp-features__grid">
      @for (f of features; track f.title) {
        <div class="lp-feature-card">
          <div class="lp-feature-card__icon">
            <svg [lucideIcon]="f.icon" [size]="20" strokeWidth="2.2"></svg>
          </div>
          <h3 class="lp-feature-card__title">{{ f.title }}</h3>
          <p class="lp-feature-card__desc">{{ f.desc }}</p>
        </div>
      }
    </div>
  </div>
</section>
