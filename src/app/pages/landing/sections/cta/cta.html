<section class="lp-cta">
  <div class="lp-container">
    <div class="lp-cta__box">
      <div class="lp-cta__bg-shape"></div>
      <div class="lp-cta__content">
        <h2 class="lp-cta__title">Ready to start your career journey?</h2>
        <p class="lp-cta__sub">
          Join more than 200,000 professionals who have found their dream jobs.
        </p>
        <div class="lp-cta__actions">
          <a routerLink="/auth/register" class="lp-btn lp-btn--white lp-btn--lg">
            Sign Up Now — Free
            <svg [lucideIcon]="arrowRightIcon" [size]="18"></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
